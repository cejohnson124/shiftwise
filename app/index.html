<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shiftwise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Offline fallback: the same fonts the ad uses */
  @font-face { font-family: Brico; src: url(../media/ad/fonts/bricolage.woff2) format('woff2'); font-weight: 200 800; }
  @font-face { font-family: CaveatLocal; src: url(../media/ad/fonts/caveat.woff2) format('woff2'); font-weight: 400 700; }

  :root {
    --navy: #1B2A41;
    --navy-2: #2A3B55;
    --navy-soft: #E6EAF1;
    --amber: #FFB627;
    --amber-dk: #D99413;
    --amber-soft: #FFF3DC;
    --ink: #0F1A2B;
    --cream: #F4EFE6;
    --paper: #F7F4EE;
    --card: #ffffff;
    --red: #D2453B;
    --red-soft: #FBE7E5;
    --green: #2E7D4F;
    --green-soft: #E3F3EA;
    --muted: #5B6478;
    --line: #DDD8CE;
    --radius: 20px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Bricolage Grotesque", Brico, system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
  .hand { font-family: "Caveat", CaveatLocal, cursive; color: var(--amber-dk); font-weight: 700; }
  h1, h2, h3 { color: var(--navy); letter-spacing: -0.015em; line-height: 1.15; margin: 0; }
  h1 { font-size: clamp(1.7rem, 4vw, 2.3rem); font-weight: 800; }
  h2 { font-size: 1.35rem; font-weight: 800; }
  h3 { font-size: 1.05rem; font-weight: 700; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: .88rem; }
  .hidden, [hidden] { display: none !important; }

  /* Logo mark (the "two shifts" S from the ad) */
  .mark { width: 34px; height: 34px; flex: none; display: block; }

  /* Top bar */
  .top { background: var(--navy); color: var(--cream); }
  .top .wrap { display: flex; align-items: center; gap: 14px; min-height: 64px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.3rem; letter-spacing: -.01em; color: inherit; text-decoration: none; }
  a.brand:hover { opacity: .85; }
  .top .meta { color: #AEB7C6; font-size: .9rem; border-left: 1px solid var(--navy-2); padding-left: 14px; }
  .userbox { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: .92rem; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: var(--amber); color: var(--navy); flex: none; }
  .avatar.navy { background: var(--cream); color: var(--navy); }
  .linkbtn { background: none; border: 0; color: inherit; font: inherit; text-decoration: underline; cursor: pointer; padding: 0; }

  /* Tabs */
  .tabs { display: flex; gap: 8px; padding-top: 18px; padding-bottom: 4px; overflow-x: auto; scrollbar-width: none; }
  .tab {
    font: inherit; font-weight: 700; font-size: .95rem; white-space: nowrap;
    padding: 9px 18px; border-radius: 999px; border: 2px solid var(--line);
    background: var(--card); color: var(--navy); cursor: pointer;
  }
  .tab.on { background: var(--navy); border-color: var(--navy); color: var(--cream); }
  .badge { display: inline-block; background: var(--amber); color: var(--navy); border-radius: 999px; font-size: .74rem; padding: 0 8px; margin-left: 6px; font-weight: 800; line-height: 1.6; }

  main { padding-top: 18px; padding-bottom: 60px; }

  /* Buttons */
  .btn {
    font: inherit; font-weight: 700; font-size: 1rem;
    border-radius: 999px; padding: 11px 22px; border: 2px solid transparent;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .12s ease, box-shadow .12s ease; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); }
  .btn:active:not(:disabled) { transform: translateY(2px); }
  .btn-amber { background: var(--amber); color: var(--navy); box-shadow: 0 5px 0 var(--amber-dk); }
  .btn-navy { background: var(--navy); color: var(--cream); box-shadow: 0 5px 0 var(--ink); }
  .btn-ghost { background: var(--card); border-color: var(--navy); color: var(--navy); }
  .btn-danger { background: var(--card); border-color: var(--red); color: var(--red); }
  .btn-sm { padding: 6px 14px; font-size: .88rem; }
  .btn-block { width: 100%; }
  .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
  .btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

  /* Cards & pills */
  .card { background: var(--card); border-radius: var(--radius); padding: 22px; box-shadow: 0 12px 30px -20px rgba(27,42,65,.35); }
  .card + .card { margin-top: 18px; }
  .stack > * + * { margin-top: 18px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .spread { justify-content: space-between; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: .82rem; white-space: nowrap; }
  .pill svg { width: 14px; height: 14px; fill: currentColor; }
  .pill.amber { background: var(--amber); color: var(--navy); }
  .pill.outline { border: 2px solid var(--amber); color: #8A5A00; background: #fff; padding: 2px 11px; }
  .pill.red { background: var(--red-soft); color: var(--red); }
  .pill.green { background: var(--green-soft); color: var(--green); }
  .pill.navy { background: var(--navy-soft); color: var(--navy); }
  .pill.grey { background: #ECEDF1; color: var(--muted); }

  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .page-head .hand { font-size: 1.5rem; display: block; line-height: 1; margin-bottom: 2px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }

  /* Schedule grid (matches the ad's monitor UI) */
  .grid-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 4px 2px 8px; }
  .sgrid { display: grid; grid-template-columns: 96px repeat(7, minmax(96px, 1fr)); gap: 8px; min-width: 820px; }
  .dayh { text-align: center; font-weight: 700; font-size: .8rem; color: var(--navy); letter-spacing: .05em; text-transform: uppercase; }
  .dayh small { display: block; color: var(--muted); font-weight: 500; letter-spacing: 0; text-transform: none; font-size: .78rem; }
  .rowh { font-weight: 700; color: var(--muted); font-size: .88rem; align-self: center; line-height: 1.25; }
  .rowh small { display: block; font-weight: 500; font-size: .74rem; }
  .cell { border: 1.5px dashed #C9CED6; border-radius: 12px; padding: 6px; display: flex; flex-direction: column; gap: 8px; min-height: 56px; transition: background .12s, border-color .12s; }
  .cell.empty { border-style: dotted; opacity: .5; }
  .cell.drop-hover { border-color: var(--amber); background: var(--amber-soft); }
  .cell.target { border-color: var(--amber); }
  .sblock { display: flex; flex-direction: column; gap: 5px; }
  .sblock + .sblock { border-top: 1px solid var(--line); padding-top: 8px; }
  .sblock .stime { font-size: .7rem; color: var(--muted); text-align: center; font-weight: 600; }
  .chip {
    display: flex; align-items: center; justify-content: center; min-height: 30px; border-radius: 8px;
    background: var(--navy); color: var(--cream); font: inherit; font-size: .82rem; font-weight: 650;
    border: 0; width: 100%; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  button.chip { cursor: pointer; }
  button.chip:hover { filter: brightness(1.15); }
  .chip.open { background: transparent; color: #A06C00; border: 1.5px dashed var(--amber); }
  .chip.me { background: var(--amber); color: var(--navy); }
  .chip.sel { outline: 3px solid var(--amber); outline-offset: 2px; }
  .chip.bad { background: var(--red); color: #fff; }
  .chip.dragging { opacity: .4; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; font-size: .8rem; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; }

  /* Flag list */
  .flags { border: 2px solid var(--amber); }
  .flags-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .flag { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .flag:first-of-type { border-top: 0; }
  .flag-ico { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; flex: none; font-weight: 800; font-size: .9rem; }
  .flag-ico.amber { background: var(--amber); color: var(--navy); }
  .flag-ico.red { background: var(--red); color: #fff; }
  .flag-ico.navy { background: var(--navy-soft); color: var(--navy); }
  .flag-body { flex: 1; min-width: 0; }
  .flag-body strong { color: var(--navy); }
  .flag-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .allclear { display: flex; align-items: center; gap: 10px; color: var(--green); font-weight: 700; }

  /* Rule check strip */
  .rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
  .rule { display: flex; gap: 10px; align-items: flex-start; background: var(--card); border-radius: 14px; padding: 12px 14px; font-size: .88rem; box-shadow: 0 8px 20px -16px rgba(27,42,65,.4); }
  .tick { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; color: #fff; font-size: .78rem; font-weight: 800; }
  .tick.ok { background: var(--green); }
  .tick.no { background: var(--red); }

  .selbar { position: sticky; top: 8px; z-index: 5; background: var(--navy); color: var(--cream); border-radius: 14px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: .92rem; margin-bottom: 12px; }
  .selbar .btn-ghost { background: transparent; color: var(--cream); border-color: var(--cream); }

  /* Hours table */
  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  th { text-align: left; font-size: .76rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; padding: 8px 8px; border-bottom: 2px solid var(--line); }
  td { padding: 10px 8px; border-bottom: 1px solid #EEEAE2; vertical-align: middle; }
  .table-scroll { overflow-x: auto; }
  .bar { height: 10px; border-radius: 999px; background: #ECEDF1; position: relative; overflow: hidden; min-width: 90px; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--navy); border-radius: 999px; }
  .bar i.full { background: var(--amber); }
  .bar b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }

  /* Forms */
  label.f { display: grid; gap: 6px; font-weight: 600; font-size: .88rem; color: var(--navy); }
  input, select, textarea {
    font: inherit; font-size: 1rem; padding: 11px 14px; border-radius: 12px;
    border: 2px solid var(--line); background: #fff; color: var(--ink); width: 100%; min-width: 0;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--amber); }
  input.sm { padding: 7px 10px; font-size: .92rem; border-radius: 10px; }
  .fgrid { display: grid; gap: 14px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; font-weight: 650; color: var(--navy); font-size: 1.02rem; }
  .switch { position: relative; width: 60px; height: 34px; flex: none; }
  .switch input { position: absolute; opacity: 0; inset: 0; cursor: pointer; z-index: 1; margin: 0; }
  .switch i { position: absolute; inset: 0; border-radius: 999px; background: #D5D9DF; transition: background .15s; }
  .switch i::after { content: ""; position: absolute; left: 4px; top: 4px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .switch input:checked + i { background: var(--amber); }
  .switch input:checked + i::after { transform: translateX(26px); }
  .switch input:focus-visible + i { outline: 3px solid var(--navy); outline-offset: 2px; }
  .err { color: var(--red); font-size: .88rem; font-weight: 600; }

  /* Modal / sheet */
  .overlay { position: fixed; inset: 0; background: rgba(15,26,43,.55); z-index: 50; display: flex; align-items: flex-end; justify-content: center; padding: 0; }
  @media (min-width: 640px) { .overlay { align-items: center; padding: 20px; } }
  .sheet { background: var(--paper); width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; border-radius: 28px 28px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.3); }
  @media (min-width: 640px) { .sheet { border-radius: 28px; } }
  .sheet-head { background: var(--navy); color: var(--cream); padding: 16px 22px; display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.15rem; }
  .sheet-head .x { margin-left: auto; background: none; border: 0; color: var(--cream); font-size: 1.6rem; line-height: 1; cursor: pointer; padding: 0 4px; }
  .sheet-body { padding: 22px; }
  .sheet-body h2 { font-size: 1.7rem; margin-bottom: 14px; }
  .done { text-align: center; padding: 34px 22px 26px; }
  .done .check { width: 92px; height: 92px; border-radius: 50%; background: var(--amber); display: grid; place-items: center; margin: 0 auto 16px; animation: pop .35s cubic-bezier(.3,1.6,.6,1); }
  .done .check svg { width: 46px; height: 46px; stroke: var(--navy); stroke-width: 4.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .done h2 { font-size: 2rem; margin-bottom: 4px; }
  @keyframes pop { from { transform: scale(.4); } to { transform: scale(1); } }
  .pick { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; font: inherit; background: var(--card); border: 2px solid transparent; border-radius: 14px; padding: 10px 12px; cursor: pointer; margin-bottom: 8px; }
  .pick:hover:not(:disabled) { border-color: var(--amber); }
  .pick:disabled { opacity: .55; cursor: not-allowed; }
  .pick .grow { flex: 1; min-width: 0; }

  /* Toast */
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--navy); color: var(--cream); padding: 12px 20px; border-radius: 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.3); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 80; max-width: calc(100% - 32px); text-align: center; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Employee */
  .reminder { background: var(--amber-soft); border: 2px dashed var(--amber); border-radius: 26px; padding: 22px 24px; display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
  .reminder .hand { font-size: 1.5rem; display: block; line-height: 1; }
  .reminder.closed { background: #fff; border-color: var(--line); }
  .notice { background: var(--navy); color: var(--cream); border-radius: 18px; padding: 14px 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .notice .hand { color: var(--amber); font-size: 1.45rem; line-height: 1; }
  .notice .btn-ghost { background: transparent; color: var(--cream); border-color: var(--cream); margin-left: auto; }
  .myshifts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .myshift { background: var(--navy); color: var(--cream); border-radius: 16px; padding: 14px 16px; }
  .myshift strong { display: block; font-size: 1.05rem; }
  .myshift span { color: #C3CBDA; font-size: .9rem; }
  .clist { display: grid; gap: 10px; }
  .citem { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; font: inherit; background: var(--card); border: 2px solid transparent; border-radius: 16px; padding: 14px 16px; cursor: pointer; box-shadow: 0 8px 20px -16px rgba(27,42,65,.4); }
  .citem:hover { border-color: var(--amber); }
  .citem.past { opacity: .55; }
  .cdate { width: 54px; height: 54px; border-radius: 14px; background: var(--navy-soft); color: var(--navy); display: grid; place-items: center; text-align: center; line-height: 1.05; flex: none; font-weight: 800; }
  .cdate small { display: block; font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .citem .grow { flex: 1; min-width: 0; }
  .citem .grow strong { color: var(--navy); display: block; }

  /* Login */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 30px 16px; position: relative; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; z-index: 0; }
  .login .card { position: relative; z-index: 1; width: 100%; max-width: 460px; padding: 30px; }
  .login .brand { color: var(--navy); font-size: 1.6rem; margin-bottom: 18px; }
  .who-list { display: grid; gap: 8px; margin-top: 16px; }

  /* Review list */
  .rv { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
  .rv:first-child { border-top: 0; }
  .rv strong { color: var(--navy); }
  .section-label { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; margin: 4px 0 6px; }

  .empty-state { text-align: center; padding: 46px 20px; }
  .empty-state .hand { font-size: 1.7rem; }
  .empty-state p { max-width: 46ch; margin: 8px auto 20px; }

  .print-title { display: none; }

  @media (max-width: 720px) {
    .top .meta { display: none; }
    .userbox .uname { display: none; }
    .two { grid-template-columns: 1fr; }
    .rv { grid-template-columns: 1fr; }
    .card { padding: 18px; }
  }

  /* Side decorations: ad-style props that drift in the empty gutters as you scroll */
  #app { position: relative; z-index: 1; }
  #deco { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .d-item { position: absolute; top: 0; will-change: transform; }
  .d-item > * { animation: bob var(--dur, 5s) ease-in-out var(--delay, 0s) infinite alternate; }
  @media (prefers-reduced-motion: reduce) { .d-item > * { animation: none; } }
  @keyframes bob { from { translate: 0 -7px; rotate: -2deg; } to { translate: 0 7px; rotate: 2deg; } }
  .d-note { width: 124px; padding: 20px 12px 14px; font-family: "Caveat", CaveatLocal, cursive; font-weight: 700; font-size: 1.4rem; line-height: 1.02; color: var(--navy); text-align: center; border-radius: 3px; box-shadow: 0 12px 22px -14px rgba(15,26,43,.5); position: relative; }
  .d-note.amber { background: var(--amber); }
  .d-note.cream { background: #fff; }
  .d-note.red { color: var(--red); background: #fff; font-size: 1.7rem; }
  .d-note .pin { position: absolute; top: 7px; left: 50%; width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%; background: var(--red); }
  .d-chip { display: inline-block; padding: 7px 18px; border-radius: 9px; background: var(--navy); color: var(--cream); font-weight: 700; font-size: .92rem; white-space: nowrap; box-shadow: 0 10px 20px -12px rgba(15,26,43,.5); }
  .d-chip.open { background: var(--paper); color: #A06C00; border: 1.5px dashed var(--amber); box-shadow: none; }
  .d-chip.amber { background: var(--amber); color: var(--navy); }
  .d-flag { display: inline-flex; gap: 6px; align-items: center; padding: 6px 14px; border-radius: 999px; background: var(--amber); color: var(--navy); font-weight: 700; font-size: .85rem; white-space: nowrap; box-shadow: 0 10px 20px -12px rgba(15,26,43,.5); }
  .d-flag svg { width: 13px; height: 13px; fill: currentColor; }
  .d-check { width: 58px; height: 58px; border-radius: 50%; background: var(--amber); display: grid; place-items: center; box-shadow: 0 10px 20px -12px rgba(15,26,43,.5); }
  .d-check svg { width: 30px; height: 30px; stroke: var(--navy); stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .d-mark svg { width: 54px; height: 54px; display: block; filter: drop-shadow(0 10px 12px rgba(15,26,43,.25)); }
  .d-slice svg { width: 96px; display: block; }
  .d-mini { background: #fff; border-radius: 14px; padding: 10px; display: grid; grid-template-columns: repeat(3, 28px); gap: 5px; box-shadow: 0 12px 22px -14px rgba(15,26,43,.5); }
  .d-mini i { height: 14px; border-radius: 4px; background: var(--navy); }
  .d-mini i.a { background: var(--amber); }
  .d-mini i.o { background: transparent; border: 1.5px dashed var(--amber); }

  @media print {
    #deco { display: none !important; }
    @page { size: landscape; margin: 10mm; }
    body { background: #fff; }
    .top, .tabs, .no-print, .flags, .rules, .selbar, .reminder, .notice, #toast { display: none !important; }
    .card { box-shadow: none; padding: 0; }
    .grid-scroll { overflow: visible; }
    .sgrid { min-width: 0; }
    .print-title { display: block; margin-bottom: 12px; }
    .chip, .chip.me, .pill { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* =====================================================================
   Shiftwise — functional draft
   Single file. All data lives in this browser (localStorage).
   Rules come from problem.md / solution.md.
   ===================================================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- dates & times (all local, ISO "YYYY-MM-DD") ---------- */
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return iso(d); };
const todayISO = () => iso(new Date());
const daysBetween = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const nextMonday = s => { const dow = pd(s).getDay(); return addDays(s, ((8 - dow) % 7) || 7); };
const weekDates = wk => [0, 1, 2, 3, 4, 5, 6].map(i => addDays(wk, i));
const DAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DAYLONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const fmtDate = s => pd(s).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
const fmtShort = s => pd(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fmtTime = t => { let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return m ? `${h}:${pad(m)} ${ap}` : `${h} ${ap}`; };
const dur = sh => Math.max(0, (toMin(sh.end) - toMin(sh.start)) / 60);
const fmtH = h => (Math.round(h * 10) / 10) + 'h';
const parseDT = s => { const [d, t] = s.split('T'); const [y, mo, da] = d.split('-').map(Number); const [h, mi] = (t || '23:59').split(':').map(Number); return new Date(y, mo - 1, da, h, mi).getTime(); };
const dtLocal = ms => { const d = new Date(ms); return `${iso(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtDT = ms => new Date(ms).toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const weekLabel = wk => `Week of ${fmtShort(wk)}`;
const overlaps = (a1, a2, b1, b2) => a1 < b2 && b1 < a2;
const shiftsOverlap = (a, b) => a.date === b.date && overlaps(toMin(a.start), toMin(a.end), toMin(b.start), toMin(b.end));
const timeLeft = ms => {
  const d = ms - Date.now();
  if (d <= 0) return 'closed';
  const h = d / 36e5;
  if (h < 1) return `${Math.max(1, Math.round(d / 6e4))} min left`;
  if (h < 36) return `${Math.round(h)} hours left`;
  return `${Math.round(h / 24)} days left`;
};

}

  return null;
}

const emp = id => S.employees.find(e => e.id === id);
const empName = id => (emp(id) || { name: 'Former employee' }).name;
const weekShifts = (wk = S.week) => (S.shifts[wk] || []).slice().sort((a, b) => a.date.localeCompare(b.date) || toMin(a.start) - toMin(b.start));
const shiftById = id => weekShifts().find(s => s.id === id);
const sched = (wk = S.week) => S.schedules[wk] || null;
const deadlineMs = () => S.deadline;
const isOpen = () => Date.now() <= deadlineMs();

/* ---------- conflict logic ---------- */
function occursOn(c, date) {
  if (date < c.date) return false;
  if (!c.repeats) return date === c.date;
  if (c.until && date > c.until) return false;
  return daysBetween(c.date, date) % 7 === 0;
}
const occursInWeek = (c, wk = S.week) => weekDates(wk).some(d => occursOn(c, d));
const hits = (c, sh) => occursOn(c, sh.date) && (c.wholeDay || overlaps(toMin(c.start), toMin(c.end), toMin(sh.start), toMin(sh.end)));
// Late = submitted after this week's deadline AND it affects this week.
const isLate = c => c.submittedAt > deadlineMs() && occursInWeek(c);
const isLateOpen = c => isLate(c) && !c.lateHandled && c.status !== 'rejected';
// Honored when building/checking the schedule: on time (or late but the manager chose to honor it), and not rejected.
const honored = c => c.status !== 'rejected' && (!isLate(c) || c.lateHandled);
const conflictFor = (empId, sh) => S.conflicts.find(c => c.empId === empId && honored(c) && hits(c, sh));

function describeWhen(c) {
  if (c.repeats) {
    let s = `Every ${DAYLONG[pd(c.date).getDay()]}`;
    s += c.until ? `, ${fmtShort(c.date)} – ${fmtShort(c.until)}` : `, starting ${fmtShort(c.date)}`;
    return s;
  }
  return fmtDate(c.date);
}
const describeTime = c => c.wholeDay ? 'Whole day' : `${fmtTime(c.start)} – ${fmtTime(c.end)}`;

/* ---------- schedule generation ----------
   Priority (problem.md):
   1. Never schedule anyone during a conflict entered on time.
   2. Every employee appears at least once.
   3. Each shift is fully staffed.
   4. Give everyone the hours they need.
   5. Then give extra hours to people who asked for them.
   Anything that can't be filled stays open and gets flagged.            */
function generateOnce() {
  const shifts = weekShifts();
  const emps = S.employees;
  const asg = {}; shifts.forEach(s => asg[s.id] = []);
  const hrs = {}; emps.forEach(e => hrs[e.id] = 0);
  const jit = {}; emps.forEach(e => jit[e.id] = Math.random()); // random tie-breaks so each try differs

  const allowed = (e, sh) => !conflictFor(e.id, sh);
  const busy = (eid, sh, ignore) => shifts.some(o => o.id !== sh.id && o.id !== ignore && asg[o.id].includes(eid) && shiftsOverlap(o, sh));
  const sameDay = (eid, sh) => shifts.some(o => o.id !== sh.id && o.date === sh.date && asg[o.id].includes(eid));
  const eligible = (e, sh) => asg[sh.id].length < sh.needed && !asg[sh.id].includes(e.id) && allowed(e, sh) && !busy(e.id, sh);
  const assign = (e, sh) => { asg[sh.id].push(e.id); hrs[e.id] += dur(sh); };
  // Cap: never go past the hours someone needs plus the extra they asked for.
  const fitsCap = (e, sh) => hrs[e.id] + dur(sh) <= e.need + e.extra;
  const tier = e => hrs[e.id] < e.need ? 0 : hrs[e.id] < e.need + e.extra ? 1 : 2;
  const better = (sh) => (a, b) => {
    const ta = tier(a), tb = tier(b);
    if (ta !== tb) return ta - tb;
    const da = sameDay(a.id, sh) ? 1 : 0, db = sameDay(b.id, sh) ? 1 : 0;
    if (da !== db) return da - db;
    if (ta === 0) return ((b.need - hrs[b.id]) - (a.need - hrs[a.id])) || (jit[a.id] - jit[b.id]);
    if (ta === 1) return ((b.need + b.extra - hrs[b.id]) - (a.need + a.extra - hrs[a.id])) || (jit[a.id] - jit[b.id]);
    return (hrs[a.id] - hrs[b.id]) || (jit[a.id] - jit[b.id]);
  };

  // Rule 2: everyone at least once. Most-constrained people pick first.
  const availCount = e => shifts.filter(sh => allowed(e, sh)).length;
  const order = emps.slice().sort((a, b) => availCount(a) - availCount(b) || Math.random() - .5);
  for (const e of order) {
    const opts = shifts.filter(sh => eligible(e, sh));
    if (!opts.length) continue;
    const cands = sh => emps.filter(x => allowed(x, sh)).length;
    // Rule 2 outranks the hours cap, but prefer a shift that fits within it.
    opts.sort((a, b) => (fitsCap(e, b) - fitsCap(e, a)) || (b.needed - asg[b.id].length) / b.needed - (a.needed - asg[a.id].length) / a.needed || cands(a) - cands(b));
    assign(e, opts[0]);
  }

  // Rule 3–5: fill every slot, most-constrained shift first.
  for (let guard = 0; guard < 5000; guard++) {
    const open = shifts.filter(sh => asg[sh.id].length < sh.needed)
      .map(sh => ({ sh, c: emps.filter(e => eligible(e, sh) && fitsCap(e, sh)) }))
      .filter(o => o.c.length);
    if (!open.length) break;
    open.sort((a, b) => a.c.length - b.c.length);
    const { sh, c } = open[0];
    c.sort(better(sh));
    assign(c[0], sh);
  }

  // Rule 4–5 polish: hand shifts to people short of their needed hours first,
  // then to people who asked for extra hours, taking them from whoever has the most to spare.
  const target = e => e.need + e.extra;
  for (let guard = 0; guard < 400; guard++) {
    const short = emps.filter(e => hrs[e.id] < target(e))
      .sort((a, b) => ((hrs[a.id] < a.need ? 0 : 1) - (hrs[b.id] < b.need ? 0 : 1)) || ((target(b) - hrs[b.id]) - (target(a) - hrs[a.id])));
    let swapped = false;
    for (const u of short) {
      const uShort = hrs[u.id] < u.need;
      for (const sh of shifts) {
        if (asg[sh.id].includes(u.id) || !allowed(u, sh) || busy(u.id, sh)) continue;
        const d = dur(sh);
        const fits = hrs[u.id] + d <= target(u);
        const givers = asg[sh.id].map(emp).filter(v => v && shifts.filter(o => asg[o.id].includes(v.id)).length > 1 && (
          // u still needs hours: take from anyone who keeps their needed hours
          (uShort && fits && hrs[v.id] - d >= v.need) ||
          // u wants extra: only take from someone already over their own total
          (!uShort && fits && hrs[v.id] > target(v) && hrs[v.id] - d >= v.need)
        )).sort((a, b) => (hrs[b.id] - target(b)) - (hrs[a.id] - target(a)));
        const giver = givers[0];
        if (giver) {
          asg[sh.id] = asg[sh.id].map(x => x === giver.id ? u.id : x);
          hrs[giver.id] -= d; hrs[u.id] += d;
          swapped = true; break;
        }
      }
      if (swapped) break;
    }
    if (!swapped) break;
  }
  return asg;
}

// Try many times and keep the best: fewest open spots, then fewest hours short
// of what people need, then fewest extra hours left ungiven, then fewest doubles.
function generate() {
  const shifts = weekShifts();
  let best = null, bestScore = Infinity;
  for (let i = 0; i < 300; i++) {
    const asg = generateOnce();
    const hrs = {}; S.employees.forEach(e => hrs[e.id] = 0);
    let open = 0, doubles = 0;
    const days = {};
    for (const sh of shifts) {
      open += sh.needed - asg[sh.id].length;
      for (const id of asg[sh.id]) { hrs[id] += dur(sh); const k = id + sh.date; days[k] = (days[k] || 0) + 1; if (days[k] > 1) doubles++; }
    }
    let short = 0, extraLeft = 0, missing = 0;
    S.employees.forEach(e => { short += Math.max(0, e.need - hrs[e.id]); extraLeft += Math.max(0, e.need + e.extra - hrs[e.id]); if (!hrs[e.id]) missing++; });
    const score = missing * 1e7 + open * 1e5 + short * 1e3 + extraLeft * 10 + doubles;
    if (score < bestScore) { bestScore = score; best = asg; }
    if (score === 0) break;
  }
  return best;
}

/* ---------- analysis: flags + rule checks ---------- */
function analyze() {
  const shifts = weekShifts();
  const s = sched();
  const asg = s ? s.draft : null;
  const r = {
    late: S.conflicts.filter(isLateOpen),
    lateAll: S.conflicts.filter(isLate),
    pending: S.conflicts.filter(c => c.repeats && c.status === 'pending' && !isLateOpen(c)),
    unfilled: [], violations: [], missing: [], under: [], over: [], hrs: {}, count: {}, openSpots: 0, hasDraft: !!asg,
  };
  S.employees.forEach(e => { r.hrs[e.id] = 0; r.count[e.id] = 0; });
  if (!asg) return r;
  for (const sh of shifts) {
    const a = (asg[sh.id] || []).filter(emp);
    a.forEach(id => {
      r.hrs[id] += dur(sh); r.count[id]++;
      const c = conflictFor(id, sh);
      if (c) r.violations.push({ id, sh, c });
    });
    if (a.length < sh.needed) { r.unfilled.push({ sh, n: sh.needed - a.length }); r.openSpots += sh.needed - a.length; }
  }
  r.missing = S.employees.filter(e => !r.count[e.id]);
  r.under = S.employees.filter(e => r.count[e.id] && r.hrs[e.id] < e.need);
  r.over = S.employees.filter(e => r.hrs[e.id] > e.need + e.extra);
  return r;
}

/* ---------- shared schedule grid ----------
   opts: { shifts, asg, edit:bool, me:empId } */
function gridHTML(wk, opts) {
  const shifts = opts.shifts;
  const days = weekDates(wk);
  const labels = [];
  shifts.forEach(s => { if (!labels.find(l => l.label === s.label)) labels.push({ label: s.label, start: s.start, end: s.end }); });
  labels.sort((a, b) => toMin(a.start) - toMin(b.start));
  if (!labels.length) return `<div class="empty-state"><p class="muted">No shifts set up for this week yet.</p></div>`;

  let h = `<div class="grid-scroll"><div class="sgrid"><div></div>`;
  days.forEach(d => { h += `<div class="dayh">${DAY[pd(d).getDay()]}<small>${fmtShort(d)}</small></div>`; });
  for (const L of labels) {
    h += `<div class="rowh">${esc(L.label)}<small>${fmtTime(L.start)}–${fmtTime(L.end)}</small></div>`;
    for (const d of days) {
      const here = shifts.filter(s => s.date === d && s.label === L.label);
      if (!here.length) { h += `<div class="cell empty"></div>`; continue; }
      h += `<div class="cell">`;
      for (const sh of here) {
        const people = (opts.asg[sh.id] || []).filter(emp);
        const odd = sh.start !== L.start || sh.end !== L.end;
        h += `<div class="sblock" ${opts.edit ? `data-drop="${sh.id}"` : ''}>`;
        if (odd) h += `<div class="stime">${fmtTime(sh.start)}–${fmtTime(sh.end)}</div>`;
        for (const id of people) {
          const name = esc(empName(id));
          if (opts.edit) {
            const bad = conflictFor(id, sh);
            const sel = ui.sel && ui.sel.shiftId === sh.id && ui.sel.empId === id;
            h += `<button class="chip${bad ? ' bad' : ''}${sel ? ' sel' : ''}" draggable="true" data-act="chip" data-shift="${sh.id}" data-emp="${id}" title="${name}${bad ? ' — conflict on record!' : ''}">${name}</button>`;
          } else {
            h += `<span class="chip${id === opts.me ? ' me' : ''}">${name}</span>`;
          }
        }
        for (let i = people.length; i < sh.needed; i++) {
          h += opts.edit ? `<button class="chip open" data-act="open" data-shift="${sh.id}">Open</button>` : `<span class="chip open">Open</span>`;
        }
        h += `</div>`;
      }
      h += `</div>`;
    }
  }
  h += `</div></div>`;
  return h;
}

function statusPill() {
  const s = sched();
  if (!s) return `<span class="pill grey">No draft yet</span>`;
  if (!s.published) return `<span class="pill outline">Draft, not published</span>`;
  if (s.dirty) return `<span class="pill outline">Unpublished changes</span>`;
  return `<span class="pill green">Published ${fmtDT(s.published.at)}</span>`;
}

function mSchedule() {
  const s = sched();
  const a = analyze();
  const head = `<div class="page-head">
    <div><span class="hand">this week's puzzle, solved</span><h1>${weekLabel(S.week)}</h1>
      <div class="row" style="margin-top:8px">${statusPill()}<span class="muted small">Conflicts ${isOpen() ? 'close' : 'closed'} ${fmtDT(deadlineMs())}</span></div></div>
    <div class="actions no-print">
      <button class="btn ${s ? 'btn-ghost' : 'btn-amber'}" data-act="generate">${I.spark}${s ? 'Regenerate' : 'Generate schedule'}</button>
      ${s ? `<button class="btn btn-amber" data-act="publish" ${s.published && !s.dirty ? 'disabled' : ''}>${I.send}Publish</button>
      <button class="btn btn-ghost" data-act="print">${I.print}Print</button>` : ''}
    </div>
  </div>`;

  if (!s) {
    return head + `<div class="stack">${flagsCard(a)}<div class="card empty-state">
      <span class="hand">ready when you are</span>
      <h2>No draft for this week yet</h2>
      <p class="muted">Shiftwise builds the week around every on-time conflict, puts everyone on at least once, fills each shift, and gives people their hours. Anything it can't fill gets flagged for you.</p>
      <button class="btn btn-amber" data-act="generate">${I.spark}Generate schedule</button>
    </div></div>`;
  }

  return head + `<div class="stack">
    ${flagsCard(a)}
    ${rulesStrip(a)}
    <div class="card">
      <div class="print-title"><h2>${esc(S.store)} · ${weekLabel(S.week)}</h2></div>
      ${ui.sel ? `<div class="selbar no-print"><span>Moving <strong>${esc(empName(ui.sel.empId))}</strong>. Tap an open spot or a name to swap.</span>
        <span style="margin-left:auto" class="row"><button class="btn btn-sm btn-ghost" data-act="unassign">Remove from shift</button><button class="btn btn-sm btn-ghost" data-act="cancelsel">Cancel</button></span></div>` : ''}
      ${gridHTML(S.week, { shifts: weekShifts(), asg: s.draft, edit: true })}
      <div class="legend no-print">
        <span><i style="background:var(--navy)"></i>Scheduled</span>
        <span><i style="border:1.5px dashed var(--amber)"></i>Open spot</span>
        <span><i style="background:var(--red)"></i>Scheduled over a conflict</span>
        <span>Drag names between shifts, or tap a name then tap where it should go.</span>
      </div>
    </div>
    ${hoursCard(a)}
  </div>`;
}

function flagsCard(a) {
  const items = [];
  a.violations.forEach(v => items.push(`<div class="flag"><span class="flag-ico red">!</span><div class="flag-body">
    <strong>${esc(empName(v.id))}</strong> is on ${DAY[pd(v.sh.date).getDay()]} ${esc(v.sh.label)} during a conflict on record (${esc(v.c.reason || describeTime(v.c))}).
    <div class="flag-actions"><button class="btn btn-sm btn-danger" data-act="fixviolation" data-shift="${v.sh.id}" data-emp="${v.id}">Take them off this shift</button></div></div></div>`));
  a.late.forEach(c => items.push(`<div class="flag"><span class="flag-ico amber">${flagSVG.replace('<svg', '<svg width="16" height="16" fill="currentColor"')}</span><div class="flag-body">
    <strong>Late conflict: ${esc(empName(c.empId))}</strong> · ${esc(describeWhen(c))} · ${esc(describeTime(c))}${c.reason ? ` · “${esc(c.reason)}”` : ''}
    <div class="muted small">Submitted ${fmtDT(c.submittedAt)}, after the deadline, so it wasn't used to build the schedule. Handle it personally.</div>
    <div class="flag-actions"><button class="btn btn-sm btn-navy" data-act="honor" data-id="${c.id}">Honor it</button><button class="btn btn-sm btn-ghost" data-act="dismisslate" data-id="${c.id}">Don't honor</button></div></div></div>`));
  a.pending.forEach(c => items.push(`<div class="flag"><span class="flag-ico navy">↻</span><div class="flag-body">
    <strong>${esc(empName(c.empId))}</strong> has a new repeating conflict: ${esc(describeWhen(c))}, ${esc(describeTime(c))}. It's being honored. Approve it once and it applies every week.
    <div class="flag-actions"><button class="btn btn-sm btn-navy" data-act="approve" data-id="${c.id}">Approve</button><button class="btn btn-sm btn-ghost" data-act="reject" data-id="${c.id}">Reject</button></div></div></div>`));
  a.unfilled.forEach(u => items.push(`<div class="flag"><span class="flag-ico amber">${u.n}</span><div class="flag-body">
    <strong>${DAY[pd(u.sh.date).getDay()]} ${fmtShort(u.sh.date)} ${esc(u.sh.label)}</strong>: ${u.n} open spot${u.n > 1 ? 's' : ''}. Nobody else is free without breaking a conflict or going past the hours they asked for.
    <div class="flag-actions"><button class="btn btn-sm btn-ghost" data-act="open" data-shift="${u.sh.id}">Fill it myself</button></div></div></div>`));
  a.missing.forEach(e => items.push(`<div class="flag"><span class="flag-ico red">0</span><div class="flag-body"><strong>${esc(e.name)}</strong> isn't on the schedule this week.</div></div>`));
  a.over.forEach(e => items.push(`<div class="flag"><span class="flag-ico navy">+</span><div class="flag-body"><strong>${esc(e.name)}</strong> is scheduled ${fmtH(a.hrs[e.id])}, past the ${e.need + e.extra}h they asked for${a.count[e.id] === 1 ? ' (their one shift is longer than that)' : ''}.</div></div>`));
  a.under.forEach(e => items.push(`<div class="flag"><span class="flag-ico navy">h</span><div class="flag-body"><strong>${esc(e.name)}</strong> has ${fmtH(a.hrs[e.id])} of the ${e.need}h they need.</div></div>`));

  const pills = [];
  if (a.late.length) pills.push(`<span class="pill amber">${flagSVG} ${a.late.length} late conflict${a.late.length > 1 ? 's' : ''}</span>`);
  if (a.openSpots) pills.push(`<span class="pill outline">${a.openSpots} open spot${a.openSpots > 1 ? 's' : ''}</span>`);
  if (a.pending.length) pills.push(`<span class="pill navy">${a.pending.length} to approve</span>`);
  if (a.violations.length) pills.push(`<span class="pill red">${a.violations.length} conflict clash${a.violations.length > 1 ? 'es' : ''}</span>`);

  if (!items.length) {
    if (!a.hasDraft) return '';
    return `<div class="card flags"><div class="allclear">${I.check.replace('<svg', '<svg width="22" height="22" style="stroke:currentColor;fill:none;stroke-width:3"')} Nothing flagged. Every spot is filled and every conflict is respected.</div></div>`;
  }
  return `<div class="card flags"><div class="flags-head"><h2>Flags</h2>${pills.join('')}<span class="muted small" style="margin-left:auto">Also emailed to you</span></div>${items.join('')}</div>`;
}

function rulesStrip(a) {
  const n = S.employees.length;
  const on = n - a.missing.length;
  const rule = (ok, title, sub) => `<div class="rule"><span class="tick ${ok ? 'ok' : 'no'}">${ok ? '✓' : '✕'}</span><div><strong>${title}</strong><div class="muted">${sub}</div></div></div>`;
  return `<div class="rules">
    ${rule(!a.violations.length, 'No one over a conflict', a.violations.length ? `${a.violations.length} clash${a.violations.length > 1 ? 'es' : ''} to fix` : 'Every on-time conflict respected')}
    ${rule(on === n, 'Everyone scheduled', `${on} of ${n} employees on at least once`)}
    ${rule(true, 'Every spot filled or flagged', a.openSpots ? `${a.openSpots} open, all flagged above` : 'All shifts fully staffed')}
    ${rule(true, 'Late conflicts flagged', a.lateAll.length ? `${a.lateAll.length} late · ${a.late.length} still to handle` : 'None came in late')}
  </div>`;
}

function hoursCard(a) {
  const rows = S.employees.map(e => {
    const h = a.hrs[e.id], target = e.need + e.extra, max = Math.max(target, h, 1);
    const pct = Math.min(100, h / max * 100), needAt = e.need / max * 100;
    let st = h < e.need ? `<span class="pill red">${fmtH(e.need - h)} short</span>` : h <= target ? `<span class="pill green">On target</span>` : `<span class="pill navy">+${fmtH(h - target)} over</span>`;
    if (!a.count[e.id]) st = `<span class="pill red">Not scheduled</span>`;
    return `<tr><td><strong style="color:var(--navy)">${esc(e.name)}</strong></td><td>${a.count[e.id]}</td><td>${fmtH(h)}</td><td class="muted">${e.need}h${e.extra ? ` + ${e.extra}h extra` : ''}</td>
      <td style="width:28%"><div class="bar"><i class="${h >= e.need ? 'full' : ''}" style="width:${pct}%"></i><b style="left:${needAt}%"></b></div></td><td>${st}</td></tr>`;
  }).join('');
  return `<div class="card hours"><div class="row spread" style="margin-bottom:8px"><h2>Hours this week</h2><span class="muted small">Black tick = hours needed</span></div>
    <div class="table-scroll"><table><thead><tr><th>Employee</th><th>Shifts</th><th>Scheduled</th><th>Wants</th><th></th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

/* ---------- conflict review ---------- */
function mConflicts() {
  const relevant = S.conflicts.filter(c => ui.showAllConflicts || occursInWeek(c) || (c.repeats && c.status === 'pending'));
  relevant.sort((a, b) => b.submittedAt - a.submittedAt);
  const late = relevant.filter(isLateOpen);
  const pend = relevant.filter(c => !isLateOpen(c) && c.repeats && c.status === 'pending');
  const ok = relevant.filter(c => !isLateOpen(c) && !(c.repeats && c.status === 'pending') && c.status !== 'rejected');
  const rej = relevant.filter(c => c.status === 'rejected');

  const row = (c, actions, tag) => `<div class="rv"><div>
      <div class="row" style="gap:8px"><strong>${esc(empName(c.empId))}</strong>${tag || ''}</div>
      <div>${esc(describeWhen(c))} · ${esc(describeTime(c))}${c.reason ? ` · “${esc(c.reason)}”` : ''}</div>
      <div class="muted small">Submitted ${fmtDT(c.submittedAt)}</div></div>
      <div class="actions">${actions}</div></div>`;
  const sec = (title, list, fn) => list.length ? `<div class="card"><div class="section-label">${title} · ${list.length}</div>${list.map(fn).join('')}</div>` : '';

  const body =
    sec('Late, handle personally', late, c => row(c, `<button class="btn btn-sm btn-navy" data-act="honor" data-id="${c.id}">Honor it</button><button class="btn btn-sm btn-ghost" data-act="dismisslate" data-id="${c.id}">Don't honor</button>`, `<span class="pill amber">${flagSVG} Late</span>`)) +
    sec('New repeating, approve once', pend, c => row(c, `<button class="btn btn-sm btn-navy" data-act="approve" data-id="${c.id}">Approve</button><button class="btn btn-sm btn-ghost" data-act="reject" data-id="${c.id}">Reject</button>`, `<span class="pill navy">Repeats</span>`)) +
    sec('On record', ok, c => row(c, `<button class="btn btn-sm btn-ghost" data-act="reject" data-id="${c.id}">Reject</button>`, c.repeats ? `<span class="pill green">Repeats · approved</span>` : (isLate(c) ? `<span class="pill green">Late · honored</span>` : ''))) +
    sec('Rejected (employee sees “Declined”)', rej, c => row(c, `<button class="btn btn-sm btn-ghost" data-act="restore" data-id="${c.id}">Restore</button>`, `<span class="pill red">Rejected</span>`));

  return `<div class="page-head">
      <div><span class="hand">everything in one place</span><h1>Conflict review</h1>
      <p class="muted" style="margin-top:6px">${weekLabel(S.week)} · deadline ${fmtDT(deadlineMs())} · <strong>${isOpen() ? timeLeft(deadlineMs()) : 'closed'}</strong></p></div>
      <div class="actions"><button class="btn btn-ghost btn-sm" data-act="toggleall">${ui.showAllConflicts ? 'Only this week' : 'Show all conflicts'}</button>
      <button class="btn btn-amber" data-act="generate">${I.spark}Generate schedule</button></div>
    </div>
    <div class="stack">${body || `<div class="card empty-state"><span class="hand">all quiet</span><h2>No conflicts for this week</h2><p class="muted">When employees submit conflicts they show up here. On-time ones are honored automatically.</p></div>`}</div>`;
}

/* ---------- shifts setup ---------- */
function mShifts() {
  const shifts = weekShifts();
  const prev = S.shifts[addDays(S.week, -7)];
  const days = weekDates(S.week).map(d => {
    const list = shifts.filter(s => s.date === d);
    return `<div class="card"><div class="row spread" style="margin-bottom:${list.length ? 10 : 0}px"><h3>${DAYLONG[pd(d).getDay()]} <span class="muted" style="font-weight:500">${fmtShort(d)}</span></h3>
      <button class="btn btn-sm btn-ghost" data-act="addshift" data-date="${d}">${I.plus}Add shift</button></div>
      ${list.length ? `<div class="table-scroll"><table><thead><tr><th>Name</th><th>Start</th><th>End</th><th>People needed</th><th>Hours</th><th></th></tr></thead><tbody>
        ${list.map(s => `<tr>
          <td><input class="sm" value="${esc(s.label)}" data-change="shift" data-id="${s.id}" data-f="label" style="min-width:110px"></td>
          <td><input class="sm" type="time" value="${s.start}" data-change="shift" data-id="${s.id}" data-f="start"></td>
          <td><input class="sm" type="time" value="${s.end}" data-change="shift" data-id="${s.id}" data-f="end"></td>
          <td><input class="sm" type="number" min="1" max="30" value="${s.needed}" data-change="shift" data-id="${s.id}" data-f="needed" style="width:80px"></td>
          <td class="muted">${fmtH(dur(s))}</td>
          <td><button class="btn btn-sm btn-danger" data-act="delshift" data-id="${s.id}" aria-label="Delete shift">Delete</button></td></tr>`).join('')}
      </tbody></table></div>` : `<p class="muted small">No shifts. Closed this day?</p>`}</div>`;
  }).join('');
  const total = shifts.reduce((t, s) => t + s.needed, 0), hours = shifts.reduce((t, s) => t + s.needed * dur(s), 0);
  const want = S.employees.reduce((t, e) => t + e.need, 0);
  return `<div class="page-head">
      <div><span class="hand">set it once a week</span><h1>Shifts · ${weekLabel(S.week)}</h1>
      <p class="muted" style="margin-top:6px">${shifts.length} shifts · ${total} spots · ${fmtH(hours)} of work · your team needs ${want}h</p></div>
      <div class="actions">
        ${prev ? `<button class="btn btn-ghost btn-sm" data-act="copyprev">Copy last week</button>` : ''}
        <button class="btn btn-ghost btn-sm" data-act="template">Use Lunch + Dinner template</button>
      </div></div>
    <div class="stack">${days}</div>`;
}

/* ---------- employees ---------- */

      <p class="muted" style="margin-top:6px">Add people here, then they sign in with their company login. Set the hours each one needs, plus any extra hours they've asked for.</p></div></div>

        <td><input class="sm" type="number" min="0" max="60" value="${e.need}" data-change="emp" data-id="${e.id}" data-f="need" style="width:90px"></td>

/* ---------- settings ---------- */
function mSettings() {
  const log = S.testLog.slice().sort((a, b) => a.submittedAt - b.submittedAt);
  return `<div class="page-head"><div><span class="hand">behind the scenes</span><h1>Settings</h1></div></div>
  <div class="stack">
    <div class="card"><h2>Store &amp; week</h2>
      <div class="fgrid" style="margin-top:14px">
        <label class="f">Store name<input value="${esc(S.store)}" data-change="store"></label>
        <div class="row spread"><div><strong style="color:var(--navy)">Now scheduling: ${weekLabel(S.week)}</strong>
          <div class="muted small">After you publish, move on to next week. Repeating conflicts carry over automatically.</div></div>
          <button class="btn btn-ghost" data-act="nextweek">Start next week ${I.arrow}</button></div>
      </div></div>

    <div class="card"><h2>Conflict deadline</h2>
      <p class="muted" style="margin-top:4px">Conflicts are due the day before you build the schedule. Anything later is flagged for you to handle personally.</p>
      <div class="row" style="margin-top:14px;align-items:flex-end">
        <label class="f" style="flex:1;min-width:220px">Deadline<input type="datetime-local" value="${dtLocal(S.deadline)}" data-change="deadline"></label>
        <span class="pill ${isOpen() ? 'green' : 'grey'}" style="margin-bottom:10px">${isOpen() ? 'Open · ' + timeLeft(deadlineMs()) : 'Closed'}</span>
        ${isOpen() ? `<button class="btn btn-navy" data-act="closenow">Close conflicts now</button>` : `<button class="btn btn-ghost" data-act="reopen">Reopen for 24 hours</button>`}
      </div></div>

      <div class="actions"><button class="btn btn-sm btn-ghost" data-act="copylog" ${log.length ? '' : 'disabled'}>Copy as table</button><button class="btn btn-sm btn-danger" data-act="clearlog" ${log.length ? '' : 'disabled'}>Clear</button></div></div>
      ${log.length ? `<div class="table-scroll" style="margin-top:12px"><table><thead><tr><th>Employee</th><th>Submitted</th><th>Time taken</th><th>On time?</th><th>Notes</th></tr></thead><tbody>
        ${log.map(l => `<tr><td><strong style="color:var(--navy)">${esc(l.name)}</strong></td><td>${fmtDT(l.submittedAt)}</td><td>${l.seconds}s</td>
          <td>${l.late ? '<span class="pill amber">Late</span>' : '<span class="pill green">On time</span>'}</td>
          <td><input class="sm" value="${esc(l.note || '')}" placeholder="Questions, problems…" data-change="lognote" data-id="${l.id}" style="min-width:180px"></td></tr>`).join('')}
      </tbody></table></div>` : `<p class="muted small" style="margin-top:12px">No submissions yet.</p>`}
    </div>

    <div class="card"><h2>Data</h2>
      <p class="muted" style="margin-top:4px">Everything is saved in this browser only.</p>
      <div class="actions" style="margin-top:14px">
        <button class="btn btn-ghost" data-act="reset">Reset for classmate test</button>
        <button class="btn btn-ghost" data-act="demo">Load demo week</button>
      </div>
      <p class="muted small" style="margin-top:10px"><strong>Classmate test:</strong> 8 employees, no conflicts, deadline open. Have classmates sign in and enter conflicts, tap <em>Close conflicts now</em>, have one more classmate submit late, then generate.<br><strong>Demo week:</strong> sample conflicts with Marcus's late wedding request, like in the ad.</p>
    </div>
  </div>`;
}

/* =====================================================================
   EMPLOYEE
   ===================================================================== */
function employeeTabs() {
  const t0 = todayISO();
  const mine = S.conflicts.filter(c => c.empId === S.session && (c.repeats ? (!c.until || c.until >= t0) : c.date >= t0)).length;
  const t = (k, label, b) => `<button class="tab${ui.etab === k ? ' on' : ''}" data-act="etab" data-k="${k}">${label}${b ? `<span class="badge">${b}</span>` : ''}</button>`;
  return `<nav class="tabs wrap no-print">${t('home', 'Schedule')}${t('mine', 'My conflicts', mine)}</nav>`;
}
function employeeView(e) { return ui.etab === 'mine' ? eMine(e) : eHome(e); }

function latestPublished() {
  if (S.schedules[S.week] && S.schedules[S.week].published) return S.week;
  const ks = Object.keys(S.schedules).filter(k => S.schedules[k].published && k <= S.week).sort().reverse();
  return ks[0] || null;
}

function eHome(e) {
  const pubWk = latestPublished();
  const pub = pubWk ? S.schedules[pubWk].published : null;
  let out = '';

  if (pub && (S.seen[e.id] || 0) < pub.at) {
    out += `<div class="notice"><span class="hand">fresh off the press!</span><span>The schedule for <strong>${weekLabel(pubWk)}</strong> is posted. It's also in your email.</span><button class="btn btn-sm btn-ghost" data-act="seen">Got it</button></div>`;
  }
  const declined = S.conflicts.filter(c => c.empId === e.id && c.status === 'rejected' && occursInWeek(c));
  if (declined.length) out += `<div class="notice" style="background:var(--red)"><span>Your manager declined ${declined.length} conflict${declined.length > 1 ? 's' : ''} for ${weekLabel(S.week)}. See <button class="linkbtn" data-act="etab" data-k="mine">My conflicts</button>, and talk to them if you have questions.</span></div>`;

  const open = isOpen();
  out += `<div class="reminder${open ? '' : ' closed'}">
    <div><span class="hand">${open ? 'heads up!' : 'deadline passed'}</span>
      <h2>Conflicts for ${weekLabel(S.week)}</h2>
      <p class="muted" style="margin-top:4px">${open
        ? `Due <strong>${fmtDT(deadlineMs())}</strong> · ${timeLeft(deadlineMs())}. Enter anything you can't work, and you won't be scheduled then.`
        : `You can still submit, but late conflicts aren't used to build the schedule. Your manager will handle them personally.`}</p></div>
    <button class="btn btn-amber" data-act="newconflict">${I.plus}Add conflict</button>
  </div>`;

  if (!pub) {
    out += `<div class="card empty-state"><span class="hand">nothing yet</span><h2>No schedule posted yet</h2><p class="muted">You'll get a notification and an email when your manager publishes it.</p></div>`;
    return `<div class="stack">${out}</div>`;
  }
  const mineSh = pub.shifts.filter(s => (pub.asg[s.id] || []).includes(e.id)).sort((a, b) => a.date.localeCompare(b.date) || toMin(a.start) - toMin(b.start));
  const hrs = mineSh.reduce((t, s) => t + dur(s), 0);
  out += `<div class="card"><div class="row spread" style="margin-bottom:12px"><div><h2>My shifts · ${weekLabel(pubWk)}</h2><p class="muted small">${mineSh.length} shift${mineSh.length === 1 ? '' : 's'} · ${fmtH(hrs)}</p></div></div>
    ${mineSh.length ? `<div class="myshifts">${mineSh.map(s => `<div class="myshift"><strong>${fmtDate(s.date)}</strong><span>${esc(s.label)} · ${fmtTime(s.start)} – ${fmtTime(s.end)}</span></div>`).join('')}</div>` : `<p class="muted">You're not on the schedule this week.</p>`}
  </div>
  <div class="card"><div class="print-title"><h2>${esc(S.store)} · ${weekLabel(pubWk)}</h2></div>
    <div class="row spread" style="margin-bottom:10px"><h2 class="no-print">Team schedule</h2><button class="btn btn-sm btn-ghost no-print" data-act="print">${I.print}Print</button></div>
    ${gridHTML(pubWk, { shifts: pub.shifts, asg: pub.asg, me: e.id })}
    <div class="legend no-print"><span><i style="background:var(--amber)"></i>You</span><span><i style="background:var(--navy)"></i>Teammates</span></div>
  </div>`;
  return `<div class="stack">${out}</div>`;
}

function empStatus(c) {
  if (c.status === 'rejected') return `<span class="pill red">Declined</span>`;
  if (isLateOpen(c)) return `<span class="pill amber">Late · manager will review</span>`;
  if (isLate(c) && c.lateHandled) return `<span class="pill green">Honored</span>`;
  if (c.repeats && c.status === 'pending') return `<span class="pill navy">Waiting for approval</span>`;
  if (c.repeats) return `<span class="pill green">Approved · repeats</span>`;
  return `<span class="pill green">On record</span>`;
}

function eMine(e) {
  const t = todayISO();
  const list = S.conflicts.filter(c => c.empId === e.id);
  const isPast = c => c.repeats ? (c.until && c.until < t) : c.date < t;
  list.sort((a, b) => (isPast(a) - isPast(b)) || a.date.localeCompare(b.date));
  return `<div class="page-head"><div><span class="hand">only you and your manager see these</span><h1>My conflicts</h1></div>
    <button class="btn btn-amber" data-act="newconflict">${I.plus}Add conflict</button></div>
    ${list.length ? `<div class="clist">${list.map(c => {
      const d = pd(c.date);
      return `<button class="citem${isPast(c) ? ' past' : ''}" data-act="viewconflict" data-id="${c.id}">
        <span class="cdate"><span><small>${c.repeats ? 'Every' : DAY[d.getDay()]}</small>${c.repeats ? DAY[d.getDay()] : d.getDate()}</span></span>
        <span class="grow"><strong>${esc(c.reason || 'Conflict')}</strong><span class="muted small">${esc(describeWhen(c))} · ${esc(describeTime(c))}</span></span>
        ${empStatus(c)}</button>`;
    }).join('')}</div>` : `<div class="card empty-state"><span class="hand">a clean slate</span><h2>No conflicts yet</h2><p class="muted">Add a time you can't work, like a class, a family event or a standing day off, and you won't be scheduled then.</p><button class="btn btn-amber" data-act="newconflict">${I.plus}Add conflict</button></div>`}`;
}

function submittedSheet(late, edit) {

function conflictDetail(c) {

function pickerSheet(shiftId) {
  const sh = shiftById(shiftId);
  const a = analyze();
  const list = S.employees.map(e => ({ e, why: blocker(e.id, sh, null) }))
    .sort((x, y) => (!!x.why - !!y.why) || ((y.e.need - a.hrs[y.e.id]) - (x.e.need - a.hrs[x.e.id])));
  return `<div class="sheet" role="dialog" aria-label="Fill open spot">
