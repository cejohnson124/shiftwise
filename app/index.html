        <span class="avatar">${esc(e.name[0])}</span><span class="grow"><strong>${esc(e.name)}</strong><br><span class="muted small">${why ? esc(why) : `${fmtH(a.hrs[e.id])} of ${e.need}h needed${e.extra ? ` (+${e.extra}h extra)` : ''}${a.hrs[e.id] + dur(sh) > e.need + e.extra ? ` · <strong style="color:var(--red)">would go ${fmtH(a.hrs[e.id] + dur(sh) - e.need - e.extra)} over</strong>` : ''}`}</span></span></button>`).join('')}
    </div></div>`;
}

/* ---------- editing the draft ---------- */
function blocker(empId, sh, ignoreShiftId) {
  const asg = sched().draft;
  if ((asg[sh.id] || []).includes(empId)) return 'Already on this shift';
  const c = conflictFor(empId, sh);
  if (c) return `Conflict on record${c.reason ? `: ${c.reason}` : ''}`;
  const other = weekShifts().find(o => o.id !== sh.id && o.id !== ignoreShiftId && (asg[o.id] || []).includes(empId) && shiftsOverlap(o, sh));
  if (other) return `Already working ${other.label} then`;
  return '';
}
function touched() { const s = sched(); if (s.published) s.dirty = true; save(); }
function moveTo(empId, fromId, toId) {
  const s = sched(), to = shiftById(toId);
  if (!to) return;
  if (fromId === toId) { ui.sel = null; return render(); }
  s.draft[toId] = s.draft[toId] || [];
  if (s.draft[toId].filter(emp).length >= to.needed) return toast('That shift is full. Drop onto a name to swap.');
  const why = blocker(empId, to, fromId);
  if (why) return toast(`Can't move ${empName(empId)}: ${why.toLowerCase()}.`);
  if (fromId) s.draft[fromId] = (s.draft[fromId] || []).filter(x => x !== empId);
  s.draft[toId].push(empId);
  ui.sel = null; touched(); render();
}
function swap(aEmp, aShift, bEmp, bShift) {
  if (aShift === bShift) { ui.sel = null; return render(); }
  const s = sched(), A = shiftById(aShift), B = shiftById(bShift);
  if ((s.draft[bShift] || []).includes(aEmp) || (s.draft[aShift] || []).includes(bEmp)) return toast('They’re already on each other’s shift.');
  const w1 = blocker(aEmp, B, aShift), w2 = blocker(bEmp, A, bShift);
  if (w1) return toast(`Can't swap: ${empName(aEmp)}: ${w1.toLowerCase()}.`);
  if (w2) return toast(`Can't swap: ${empName(bEmp)}: ${w2.toLowerCase()}.`);
  s.draft[aShift] = s.draft[aShift].map(x => x === aEmp ? bEmp : x);
  s.draft[bShift] = s.draft[bShift].map(x => x === bEmp ? aEmp : x);
  ui.sel = null; touched(); render();
  toast(`Swapped ${empName(aEmp)} and ${empName(bEmp)}.`);
}

/* ---------- toast ---------- */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3400); }

/* =====================================================================
   ACTIONS
   ===================================================================== */
const A = {
  login: el => { S.session = el.dataset.id; ui.sel = null; ui.mtab = 'schedule'; ui.etab = 'home'; save(); render(); window.scrollTo(0, 0); },
  logout: () => { S.session = null; save(); render(); },
  mtab: el => { ui.mtab = el.dataset.k; ui.sel = null; render(); },
  etab: el => { ui.etab = el.dataset.k; render(); },
  close: () => closeModal(),
  overlay: (el, ev) => { if (ev.target === el) closeModal(); },
  print: () => window.print(),
  seen: () => { const w = latestPublished(); if (w) S.seen[S.session] = S.schedules[w].published.at; save(); render(); },

  /* employee */
  newconflict: () => { ui.editId = null; ui.formOpenedAt = Date.now(); openModal(conflictForm(null)); },
  viewconflict: el => { const c = S.conflicts.find(x => x.id === el.dataset.id); if (c) openModal(conflictDetail(c)); },
  editconflict: el => { const c = S.conflicts.find(x => x.id === el.dataset.id); if (c) openModal(conflictForm(c)); },
  delconflict: el => {
    if (!confirm('Delete this conflict? You could be scheduled during that time.')) return;
    S.conflicts = S.conflicts.filter(c => c.id !== el.dataset.id); save(); closeModal(); render(); toast('Conflict deleted.');
  },

  /* manager: schedule */
  generate: () => {
    if (!weekShifts().length) { ui.mtab = 'shifts'; render(); return toast('Add shifts for this week first.'); }
    if (isOpen() && !confirm(`The conflict deadline (${fmtDT(deadlineMs())}) hasn't passed yet. People can still add conflicts. Generate anyway?`)) return;
    const s = sched();
    if (s && !confirm('Regenerate? This replaces the current draft, including any changes you made by hand.')) return;
    const asg = generate();
    S.schedules[S.week] = { draft: asg, published: s ? s.published : null, dirty: !!(s && s.published) };
    ui.mtab = 'schedule'; ui.sel = null; save(); render();
    const a = analyze();
    const n = a.late.length + a.openSpots + a.pending.length;
    toast(n ? `Draft ready. ${n} item${n > 1 ? 's' : ''} flagged at the top (also emailed to you).` : 'Draft ready. Nothing flagged!');
  },
  publish: () => {
    const a = analyze();
    if (a.violations.length) return toast('Fix the conflict clashes (in red) before publishing.');
    const left = a.late.length;
    let msg = [];
    if (a.openSpots) msg.push(`${a.openSpots} open spot${a.openSpots > 1 ? 's' : ''}`);
    if (left) msg.push(`${left} late conflict${left > 1 ? 's' : ''} not handled`);
    if (msg.length && !confirm(`Publish with ${msg.join(' and ')}?`)) return;
    const s = sched();
    s.published = { shifts: clone(weekShifts()), asg: clone(s.draft), at: Date.now() };
    s.dirty = false; save(); render();
    toast(`Published! ${S.employees.length} employees notified and emailed.`);
  },
  chip: el => {
    const { shift, emp: id } = el.dataset;
    if (ui.sel && !(ui.sel.shiftId === shift && ui.sel.empId === id)) return swap(ui.sel.empId, ui.sel.shiftId, id, shift);
    ui.sel = ui.sel ? null : { shiftId: shift, empId: id };
    render();
  },
  open: el => {
    if (!sched()) return;
    if (ui.sel) return moveTo(ui.sel.empId, ui.sel.shiftId, el.dataset.shift);
    openModal(pickerSheet(el.dataset.shift));
  },
  pickemp: el => { closeModal(); moveTo(el.dataset.emp, null, el.dataset.shift); },
  unassign: () => {
    const s = sched(); if (!ui.sel) return;
    s.draft[ui.sel.shiftId] = s.draft[ui.sel.shiftId].filter(x => x !== ui.sel.empId);
    toast(`${empName(ui.sel.empId)} removed. That spot is now open.`);
    ui.sel = null; touched(); render();
  },
  cancelsel: () => { ui.sel = null; render(); },
  fixviolation: el => { const s = sched(); s.draft[el.dataset.shift] = s.draft[el.dataset.shift].filter(x => x !== el.dataset.emp); touched(); render(); },

  /* manager: conflicts */
  honor: el => {
    const c = S.conflicts.find(x => x.id === el.dataset.id); if (!c) return;
    c.status = 'approved'; c.lateHandled = true;
    const s = sched(); let removed = [];
    if (s) weekShifts().forEach(sh => { if ((s.draft[sh.id] || []).includes(c.empId) && hits(c, sh)) { s.draft[sh.id] = s.draft[sh.id].filter(x => x !== c.empId); removed.push(sh); } });
    if (s && removed.length) touched(); else save();
    render();
    toast(removed.length ? `Honored. ${empName(c.empId)} taken off ${removed.map(r => `${DAY[pd(r.date).getDay()]} ${r.label}`).join(', ')}. Fill the open spot${removed.length > 1 ? 's' : ''}.` : `Honored. ${empName(c.empId)} wasn't scheduled then anyway.`);
  },
  dismisslate: el => { const c = S.conflicts.find(x => x.id === el.dataset.id); if (!c) return; c.status = 'rejected'; c.lateHandled = true; save(); render(); toast(`Kept the schedule as is. ${empName(c.empId)} sees it as declined.`); },
  approve: el => { const c = S.conflicts.find(x => x.id === el.dataset.id); if (!c) return; c.status = 'approved'; save(); render(); toast('Approved. It applies every week from now on.'); },
  reject: el => {
    const c = S.conflicts.find(x => x.id === el.dataset.id); if (!c) return;
    if (!confirm(`Reject ${empName(c.empId)}'s conflict (${describeWhen(c)})? They'll see it as declined and could be scheduled then.`)) return;
    c.status = 'rejected'; save(); render(); toast('Rejected. The employee sees “Declined”.');
  },
  restore: el => { const c = S.conflicts.find(x => x.id === el.dataset.id); if (!c) return; c.status = c.repeats ? 'approved' : 'received'; if (isLate(c)) c.lateHandled = true; save(); render(); toast('Restored. It’s honored again.'); },
  toggleall: () => { ui.showAllConflicts = !ui.showAllConflicts; render(); },

  /* manager: shifts */
  addshift: el => { (S.shifts[S.week] = S.shifts[S.week] || []).push({ id: uid(), date: el.dataset.date, label: 'Shift', start: '11:00', end: '16:00', needed: 2 }); save(); render(); },
  delshift: el => {
    S.shifts[S.week] = S.shifts[S.week].filter(s => s.id !== el.dataset.id);
    const s = sched(); if (s) { delete s.draft[el.dataset.id]; touched(); } else save();
    render();
  },
  template: () => { if (weekShifts().length && !confirm('Replace this week’s shifts with the Lunch + Dinner template?')) return; S.shifts[S.week] = template(S.week); clearDraftShifts(); save(); render(); },
  copyprev: () => {
    if (weekShifts().length && !confirm('Replace this week’s shifts with last week’s?')) return;
    S.shifts[S.week] = S.shifts[addDays(S.week, -7)].map(s => Object.assign({}, s, { id: uid(), date: addDays(s.date, 7) }));
    clearDraftShifts(); save(); render();
  },

  /* manager: employees */
  delemp: el => {
    const e = emp(el.dataset.id); if (!e || !confirm(`Remove ${e.name}? Their conflicts are removed too.`)) return;
    S.employees = S.employees.filter(x => x.id !== e.id);
    S.conflicts = S.conflicts.filter(c => c.empId !== e.id);
    Object.values(S.schedules).forEach(s => Object.keys(s.draft).forEach(k => s.draft[k] = s.draft[k].filter(x => x !== e.id)));
    save(); render();
  },

  /* manager: settings */
  closenow: () => { S.deadline = Date.now(); save(); render(); toast('Conflicts closed. Anything submitted now is flagged as late.'); },
  reopen: () => { S.deadline = Date.now() + 864e5; save(); render(); toast('Conflicts reopened for 24 hours.'); },
  nextweek: () => {
    const s = sched();
    if (!(s && s.published) && !confirm(`${weekLabel(S.week)} hasn't been published. Move on anyway?`)) return;
    const prev = S.week;
    S.week = addDays(S.week, 7);
    S.deadline = S.deadline + 7 * 864e5;
    if (!S.shifts[S.week]) S.shifts[S.week] = (S.shifts[prev] || template(prev)).map(x => Object.assign({}, x, { id: uid(), date: addDays(x.date, 7) }));
    save(); ui.mtab = 'schedule'; render(); toast(`Now scheduling ${weekLabel(S.week)}. Shifts copied from last week.`);
  },
  copylog: () => {
    const rows = [['Employee', 'Submitted', 'Seconds', 'Late', 'Notes']].concat(S.testLog.map(l => [l.name, fmtDT(l.submittedAt), l.seconds, l.late ? 'yes' : 'no', l.note || '']));
    const text = rows.map(r => r.join('\t')).join('\n');
    try { navigator.clipboard.writeText(text).then(() => toast('Copied. Paste it into a spreadsheet or evidence.md.'), () => toast('Copy failed. Select the table instead.')); } catch (e) { toast('Copy failed. Select the table instead.'); }
  },
  clearlog: () => { if (confirm('Clear the test log?')) { S.testLog = []; save(); render(); } },
  reset: () => { if (!confirm('Reset everything for a fresh classmate test? This erases all conflicts, schedules and the test log.')) return; const keep = S.session === 'manager' ? 'manager' : null; S = freshState(); S.session = keep; save(); ui.mtab = 'schedule'; render(); toast('Fresh test ready: 8 employees, no conflicts.'); },
  demo: () => { if (!confirm('Load the demo week? This replaces all current data.')) return; S = demoState(); save(); ui.mtab = 'schedule'; render(); toast('Demo week loaded. Try Generate schedule.'); },
};

function clearDraftShifts() {
  const s = sched(); if (!s) return;
  const ids = new Set(weekShifts().map(x => x.id));
  Object.keys(s.draft).forEach(k => { if (!ids.has(k)) delete s.draft[k]; });
  if (s.published) s.dirty = true;
}

/* ---------- event wiring ---------- */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.act];
  if (fn) fn(el, ev);
});

document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if ($('#modal').innerHTML) closeModal(); else if (ui.sel) { ui.sel = null; render(); } }
});

document.addEventListener('change', ev => {
  const el = ev.target;
  // conflict form toggles
  if (el.form && el.form.id === 'cform') {
    if (el.name === 'wholeDay') el.form.querySelector('[data-times]').hidden = el.checked;
    if (el.name === 'repeats') el.form.querySelector('[data-until]').hidden = !el.checked;
    return;
  }
  const k = el.dataset.change;
  if (!k) return;
  if (k === 'shift') {
    const sh = (S.shifts[S.week] || []).find(s => s.id === el.dataset.id); if (!sh) return;
    const f = el.dataset.f;
    let v = el.value;
    if (f === 'needed') v = Math.max(1, Math.min(30, parseInt(v, 10) || 1));
    if ((f === 'start' || f === 'end') && !v) return render();
    const before = sh[f]; sh[f] = v;
    if (toMin(sh.end) <= toMin(sh.start)) { sh[f] = before; toast('End time has to be after the start time.'); return render(); }
    if (f === 'label' && !String(v).trim()) sh.label = 'Shift';
    const s = sched(); if (s && s.published) s.dirty = true;
    save(); render();
  } else if (k === 'emp') {
    const e = emp(el.dataset.id); if (!e) return;
    if (el.dataset.f === 'name') { if (el.value.trim()) e.name = el.value.trim(); }
    else e[el.dataset.f] = Math.max(0, parseInt(el.value, 10) || 0);
    save(); render();
  } else if (k === 'store') { S.store = el.value.trim() || 'My store'; save(); render(); }
  else if (k === 'deadline') { if (el.value) { S.deadline = parseDT(el.value) + 59999; save(); render(); } }
  else if (k === 'lognote') { const l = S.testLog.find(x => x.id === el.dataset.id); if (l) { l.note = el.value; save(); } }
});

document.addEventListener('submit', ev => {
  ev.preventDefault();
  const f = ev.target;
  if (f.id === 'addemp') {
    const name = f.name.value.trim(); if (!name) return;
    S.employees.push({ id: uid(), name, need: Math.max(0, parseInt(f.need.value, 10) || 0), extra: Math.max(0, parseInt(f.extra.value, 10) || 0) });
    save(); render(); toast(`${name} added. They can sign in now.`);
    return;
  }
  if (f.id === 'cform') {
    const err = m => { const e = $('#cerr'); e.textContent = m; e.hidden = false; };
    const date = f.date.value, wholeDay = f.wholeDay.checked, repeats = f.repeats.checked;
    const start = wholeDay ? '00:00' : f.start.value, end = wholeDay ? '23:59' : f.end.value;
    const until = repeats ? f.until.value : '';
    if (!date) return err('Pick a date.');
    if (date < todayISO() && !f.dataset.edit) return err('That date has already passed.');
    if (!wholeDay && (!start || !end || toMin(end) <= toMin(start))) return err('The end time has to be after the start time.');
    if (until && until < date) return err('“Until” has to be after the date.');
    const now = Date.now();
    const fields = { date, wholeDay, start, end, repeats, until, reason: f.reason.value.trim(), submittedAt: now, status: repeats ? 'pending' : 'received', lateHandled: false };
    let c;
    if (f.dataset.edit) {
      c = S.conflicts.find(x => x.id === f.dataset.edit);
      if (!c) return closeModal();
      Object.assign(c, fields);
    } else {
      c = Object.assign({ id: uid(), empId: S.session }, fields);
      S.conflicts.push(c);
      S.testLog.push({ id: uid(), name: empName(S.session), openedAt: ui.formOpenedAt || now, submittedAt: now, seconds: Math.max(1, Math.round((now - (ui.formOpenedAt || now)) / 1000)), late: isLate(c), note: '' });
    }
    save(); render();
    openModal(submittedSheet(isLate(c), !!f.dataset.edit));
  }
});

/* drag & drop (desktop); tap-to-move works everywhere */
document.addEventListener('dragstart', ev => {
  const el = ev.target.closest && ev.target.closest('.chip[draggable]');
  if (!el) return;
  ui.drag = { empId: el.dataset.emp, shiftId: el.dataset.shift };
  ev.dataTransfer.effectAllowed = 'move';
  try { ev.dataTransfer.setData('text/plain', el.dataset.emp); } catch (e) {}
  el.classList.add('dragging');
});
document.addEventListener('dragend', () => { ui.drag = null; document.querySelectorAll('.drop-hover,.dragging').forEach(x => x.classList.remove('drop-hover', 'dragging')); });
document.addEventListener('dragover', ev => {
  if (!ui.drag) return;
  const z = ev.target.closest('[data-drop]');
  if (!z) return;
  ev.preventDefault();
  document.querySelectorAll('.drop-hover').forEach(x => x !== z.parentElement && x.classList.remove('drop-hover'));
  z.parentElement.classList.add('drop-hover');
});
document.addEventListener('drop', ev => {
  if (!ui.drag) return;
  const z = ev.target.closest('[data-drop]');
  if (!z) return;
  ev.preventDefault();
  const d = ui.drag; ui.drag = null;
  const onChip = ev.target.closest('.chip[data-emp]');
  if (onChip && onChip.dataset.shift !== d.shiftId) swap(d.empId, d.shiftId, onChip.dataset.emp, onChip.dataset.shift);
  else moveTo(d.empId, d.shiftId, z.dataset.drop);
});

/* keep countdowns fresh */
setInterval(() => { if (!$('#modal').innerHTML && !document.activeElement.matches('input,select,textarea')) render(); }, 60000);

render();

/* ---------- side decorations ----------
   Props from the ad (sticky notes, name chips, flags, pizza) float in the empty
   side gutters. Each moves at its own speed as you scroll and loops forever.   */
(function deco() {
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const layer = document.createElement('div');
  layer.id = 'deco'; layer.setAttribute('aria-hidden', 'true');
  document.body.prepend(layer);
  const CONTENT = 1180;
  let items = [], H = 0, ticking = false;

  const slice = '<svg viewBox="-6 -44 116 78"><g transform="rotate(-18 50 0)"><path d="M0 -6 L92 -34 L92 26Z" fill="#FFB627"/><rect x="86" y="-38" width="18" height="68" rx="9" fill="#D99413"/><circle cx="56" cy="-8" r="9" fill="#D2453B"/><circle cx="72" cy="12" r="7" fill="#D2453B"/></g></svg>';
  const mini = '<div class="d-mini">' + ['', 'a', '', '', 'o', '', 'a', '', ''].map(c => '<i class="' + c + '"></i>').join('') + '</div>';
  const note = (cls, a, b) => '<div class="d-note ' + cls + '"><span class="pin"></span>' + esc(a) + (b ? '<br>' + esc(b) : '') + '</div>';

  function pool() {
    const n = S.employees.map(e => e.name);
    const nm = (i, d) => n[i % Math.max(1, n.length)] || d;
    return [
      note('amber', nm(1, 'Jordan') + ':', 'no Tues \u2713'),
      '<span class="d-chip">' + esc(nm(4, 'Marcus')) + '</span>',
      '<div class="d-check">' + I.check + '</div>',
      note('cream', 'Sat: sister\u2019s', 'wedding!'),
      '<span class="d-flag">' + flagSVG + ' 1 late conflict</span>',
      '<div class="d-slice">' + slice + '</div>',
      '<span class="d-chip open">Open</span>',
      note('red', 'NOT', 'TUES??'),
      '<div class="d-mark">' + markSVG() + '</div>',
      '<span class="d-chip amber">' + esc(nm(6, 'Kai')) + ' +5h</span>',
      mini,
      note('cream', 'no more', 'red string!'),
      '<span class="d-chip">' + esc(nm(2, 'Priya')) + '</span>',
      note('amber', 'schedule', 'done in 5 min'),
      '<span class="d-flag">1 open spot</span>',
      '<span class="d-chip">' + esc(nm(0, 'Dev')) + '</span>',
    ];
  }

  function build() {
    const gutter = (window.innerWidth - CONTENT) / 2;
    layer.innerHTML = ''; items = [];
    if (gutter < 36) return;                     // not enough room: stay out of the way
    const scale = Math.max(.65, Math.min(1.05, gutter / 190));
    const spacing = 210 * scale;
    H = Math.max(window.innerHeight + 500, 1500);
    const per = Math.ceil(H / spacing);
    const p = gutter < 90 ? pool().filter(h => !h.startsWith("<span")) : pool();
    let k = 0;
    for (const side of ['left', 'right']) {
      for (let i = 0; i < per; i++) {
        const el = document.createElement('div');
        el.className = 'd-item';
        el.innerHTML = p[(k++ * 5 + (side === 'right' ? 3 : 0)) % p.length];
        el.style.setProperty('--dur', (4 + Math.random() * 3).toFixed(2) + 's');
        el.style.setProperty('--delay', (-Math.random() * 6).toFixed(2) + 's');
        layer.appendChild(el);
        const w = el.firstElementChild.offsetWidth * scale;
        // centre in the gutter with a little wobble; on narrow gutters, let items peek in from the edge
        const x = Math.max(-w * .3, (gutter - w) / 2 + (Math.random() - .5) * Math.max(0, gutter - w) * .5);
        el.style[side] = x + 'px';
        el.style.transformOrigin = side === 'left' ? 'left top' : 'right top';
        items.push({ el, y: i * spacing + Math.random() * spacing * .5, speed: reduce ? 0 : .12 + Math.random() * .4, rot: (Math.random() - .5) * 16, scale });
      }
    }
    update();
  }

  function update() {
    ticking = false;
    const sy = window.scrollY;
    for (const it of items) {
      const y = (((it.y - sy * it.speed) % H) + H) % H - 250;
      it.el.style.transform = 'translate3d(0, ' + y.toFixed(1) + 'px, 0) rotate(' + it.rot.toFixed(1) + 'deg) scale(' + it.scale + ')';
    }
  }

  window.addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } }, { passive: true });
  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(build, 150); });
  build();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
})();
</script>
